{% extends "base.html" %}
{% block title %}Error {{ error_code }} — spotifryer{% endblock %}

{% block content %}
<div class="container">
  <div class="hero" style="text-align: center; padding-top: 4rem;">
    <h1 style="font-size: 4rem; margin-bottom: 0.5rem;">{{ error_code }}</h1>
    <p class="subtitle">{{ error_message }}</p>
    <a href="/" style="margin-top: 2rem; display: inline-block; padding: 0.75rem 1.5rem; background: var(--accent); color: #fff; border-radius: var(--radius); text-decoration: none; font-weight: 600;">Back to Search</a>
  </div>
</div>
{% endblock %}
