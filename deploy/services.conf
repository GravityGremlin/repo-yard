# Repo Yard deploy registry.
# One line per service, pipe-separated:
#   name|git_url|compose_file|container|host_port|health_path|mode
#   mode: git    = clone + pull from fj.n0g.xyz (source of truth = live repo)
#         static = file sync from repo-yard's music-hub/ copy (music-hub has no git)
# git_url is only used for fresh clones — existing checkouts pull via their own
# configured upstream (remotes are named origin OR forgejo, URLs are case-tolerant).
# Host ports are the published ports on cthulhu (10.8.0.10); Traefik on singularity
# (10.8.0.1) routes *.n0g.xyz to these. Edit here if the fleet moves.

