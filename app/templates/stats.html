{% extends "base.html" %}
{% block content %}
  <div class="jobs-heading page-heading">
    <div><div class="masthead"><h1>Stats</h1></div><p class="eyebrow">pipeline totals · all services</p></div>
    <span class="refresh-note"><span class="refresh-dot"></span>refreshes every 10s</span>
  </div>
  <div id="stats-cards" class="stats-grid" hx-get="/stats/partial" hx-trigger="load, every 10s" hx-target="this" hx-swap="outerHTML">
    <p class="jobs-loading">loading stats<span class="caret"></span></p>
  </div>
{% endblock %}
